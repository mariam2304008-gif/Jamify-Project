<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jamify - Artist Profile</title>
    <link rel="stylesheet" href="CSS/profile.css">
    <link rel="stylesheet" href="CSS/artistProfile.css">
    <script src="JavaScript/navbar.js"></script>
</head>
<body>
<div class="main-content">

<!-- Artist Header -->
<div class="artist-header">
    <img id="artistImg" src="Images/album-profile-images/epic.png" class="artist-img">
    <div class="artist-info">
        <span class="artist-badge">🎤 Artist</span>
        <h1 id="artistName">Loading...</h1>
        <p id="artistGenre" class="artist-genre"></p>
        <p id="artistCountry" class="artist-country"></p>
        <p id="artistBio" class="artist-bio"></p>
        <div class="artist-stats">
            <span id="statAlbums">0 Albums</span>
            <span id="statSingles">0 Singles</span>
        </div>
        <div class="artist-links" id="artistLinks"></div>
    </div>
</div>

<!-- Tabs -->
<div class="tabs">
    <button class="tab active" onclick="showTab('albums', this)">Albums</button>
    <button class="tab" onclick="showTab('singles', this)">Singles</button>
</div>

<div id="albums" class="tab-content active">
    <div id="albums-container" class="albums-grid"></div>
</div>

<div id="singles" class="tab-content">
    <div id="singles-container" class="albums-grid"></div>
</div>

</div>
<script src="JavaScript/artistProfile.js"></script>
</body>
</html>
